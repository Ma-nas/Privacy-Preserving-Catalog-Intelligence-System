version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: catalog_db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: catalog_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml_classification:
    build:
      context: .
      dockerfile: Dockerfile.ml_classification
    container_name: ml_classification_service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  ml_description:
    build:
      context: .
      dockerfile: Dockerfile.ml_description
    container_name: ml_description_service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: catalog_api_gateway
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml_classification:
        condition: service_healthy
      ml_description:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://app_user:app_password@db:5432/catalog_db
      - MIGRATION_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/catalog_db
      - AUDITOR_DATABASE_URL=postgresql+psycopg://auditor_user:auditor_password@db:5432/catalog_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLASSIFICATION_SERVICE_URL=http://ml_classification:8001
      - DESCRIPTION_SERVICE_URL=http://ml_description:8002
      - JWT_SECRET_KEY=dev-insecure-secret-key-change-in-prod-32bytes
    command: >
      sh -c "alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: catalog_celery_worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml_classification:
        condition: service_healthy
      ml_description:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://app_user:app_password@db:5432/catalog_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLASSIFICATION_SERVICE_URL=http://ml_classification:8001
      - DESCRIPTION_SERVICE_URL=http://ml_description:8002
      - TENANT_MAX_CONCURRENT_TASKS=10

volumes:
  postgres_data:
  redis_data:
